<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>付款成功 | L&W Property Solutions</title>
<style>
  :root { --green: #0a5a44; --lime: #a9dc7f; --cream: #f7f5ef; --ink: #1c2b25; --muted: #5c6b64; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; color: var(--ink); background: var(--cream); line-height: 1.7; }
  header { background: var(--green); color: #fff; padding: 18px 20px; }

  main { max-width: 720px; margin: 0 auto; padding: 48px 20px 60px; text-align: center; }
  .check { width: 72px; height: 72px; border-radius: 50%; background: var(--green); color: #fff; font-size: 2.2rem; line-height: 72px; margin: 0 auto 20px; }
  h1 { color: var(--green); font-size: 1.7rem; margin: 0 0 10px; }
  p { color: var(--muted); }
  .card { background: #fff; border: 1px solid #e3e0d5; border-radius: 12px; padding: 20px 22px; margin: 24px 0; text-align: left; }
  .ref { font-size: 0.9rem; color: var(--muted); word-break: break-all; }
  .btn { display: inline-block; margin-top: 8px; padding: 12px 26px; border-radius: 10px; background: var(--green); color: #fff; font-weight: 700; text-decoration: none; }
  footer { text-align: center; color: var(--muted); font-size: 0.88rem; padding: 0 20px 40px; }

</head>

<header><div class="inner">L&amp;W Property Solutions</div></header>

    <p style="margin:0;">我们将在一个工作日内联系您，安排首次免费上门检查。如有任何问题，请致电 (347) 989-2686 或电邮 support@lw-propertysolutions.com。</p>
    <p class="ref" id="refLine"></p>
  </div>
  <a class="btn" href="index.html">返回首页</a>

<footer>L&amp;W Property Solutions (L&amp;W Home Solutions LLC) • (347) 989-2686 • support@lw-propertysolutions.com</footer>
<script>

  const sid = params.get('session_id');
  if (sid) document.getElementById('refLine').textContent = '付款编号：' + sid;
</script>

</html>
